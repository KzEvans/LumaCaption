name: Desktop builds
on: [workflow_dispatch, push, pull_request]
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze lib test scripts/artifact_manifest.dart
      - run: flutter test
      - run: LUMA_FLUTTER="$(command -v flutter)" scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LumaCaption-macos-arm64
          path: dist/*.dmg*
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze lib test scripts/artifact_manifest.dart
      - run: flutter test
      - run: choco install innosetup --version=6.4.3 -y --no-progress
      - run: scripts/build_windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: LumaCaption-windows-x64
          path: dist/*.exe*
